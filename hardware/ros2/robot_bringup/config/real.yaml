motor_bridge_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-Arduino__www.arduino.cc__Arduino_14101-if00
    serial_port_candidates: /dev/serial/by-id/usb-Arduino__www.arduino.cc__Arduino_14101-if00,/dev/serial/by-path/platform-3610000.usb-usb-0:2.3.1:1.0,/dev/ttyACM0
    serial_reconnect_interval_sec: 1.0
    serial_boot_delay_sec: 0.5
    serial_write_timeout_sec: 0.1
    cmd_vel_topic: /cmd_vel
    e_stop_topic: /safety/e_stop
    odom_topic: /odom/wheel
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: false
    wheel_radius_m: 0.044
    wheel_separation_m: 0.25
    encoder_cpr: 2464
    left_encoder_sign: 1
    right_encoder_sign: -1
    swap_wheel_commands: true
    swap_wheel_odometry: true
    max_linear_mps: 0.16
    max_angular_rps: 0.30
    calibration_csv: perception/calibration/arduino_motor/latest_pwm_calibration.csv
    min_calibration_points: 2
    min_calibration_duration_sec: 2.0
    min_pwm: 72.0
    max_pwm: 220.0
    feedforward_slope: 18.5
    left_pwm_scale: 1.0
    right_pwm_scale: 1.0
    speed_kp: 12.0
    speed_ki: 7.0

# Mecanum conversion. Activated with drive_type:=mecanum on
# real_competition_bridge.launch.py; pairs with
# hardware/firmware/arduino_mecanum. Geometry values are
# pre-assembly estimates -- re-measure wheel radius and contact-center
# half length/width after the mecanum frame is built.
mecanum_bridge_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-Arduino__www.arduino.cc__Arduino_14101-if00
    serial_port_candidates: /dev/serial/by-id/usb-Arduino__www.arduino.cc__Arduino_14101-if00,/dev/serial/by-path/platform-3610000.usb-usb-0:2.3.1:1.0,/dev/ttyACM0
    serial_reconnect_interval_sec: 1.0
    serial_boot_delay_sec: 2.0
    serial_write_timeout_sec: 0.1
    cmd_vel_topic: /cmd_vel
    move_relative_topic: /base/move_relative
    move_result_topic: /base/move_result
    e_stop_topic: /safety/e_stop
    odom_topic: /odom/wheel
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: false
    # 2026-07-15 LiDAR 실측 보정: 0.034 설정 시 전/후진 실이동이 112~116%
    # (logs/mecanum_bringup/move_accuracy_021329.json) → 유효 접지 반경 0.0388.
    wheel_radius_m: 0.0388
    # 2026-07-15 롤러 X-config 재장착 후 gyro 재캘리브레이션: 유효 회전 기하
    # (L+W)=0.198 (물리 0.275보다 작음 — dyaw 90도 명령이 158도 실회전).
    # 유효값이므로 실축간거리와 다름. 바퀴/바닥 바뀌면 51_move_accuracy_lidar로 재측정.
    half_length_m: 0.108
    half_width_m: 0.090
    encoder_cpr: 1320  # JGB37-520 실측(무부하 tick rate) = 스펙 11PPRx4x30 (2026-07-14)
    # 2026-07-14 브링업 실측: 4모터 모두 +PWM=후진 배선 → 전부 -1.
    # FR/RR 엔코더 A/B 반전 (RR은 A4 단선 수리 후 판정).
    motor_signs: [-1, -1, -1, -1]
    encoder_signs: [1, -1, 1, -1]
    # 2026-07-17 속도 캡 상향: 기존 0.24/0.20/0.8/12는 초기 브링업 안전값.
    # 펌웨어 MAX_WHEEL_RAD_S 16→30 상향과 함께 개방 (모터 무부하 34.9rad/s).
    # 실효 상한은 경기장 엔벨로프 재측정으로 확정할 것.
    max_linear_x_mps: 0.9
    max_linear_y_mps: 0.6
    max_angular_rps: 2.0
    max_wheel_rad_s: 26.0
    command_timeout_sec: 0.5
    # 2026-07-14 JGB37-520 블록 스텝 튜닝 (logs/mecanum_bringup/pid_235827) 후
    # 2026-07-15 바닥(부하) 재튜닝 (logs/mecanum_bringup/pid_verify_0137*):
    # 무부하 게인(ki=5, min_pwm=8, int_limit=8)은 바닥 저속에서 FL이 -18%까지
    # 처짐 → ki/적분한계/min_pwm 증량. 3/6/9 rad/s 전·후진 steady err<±6%,
    # rise(정지 출발)<0.6s. RR은 B상 단채널(rr1ch) 상태로 합격.
    # ff_slope는 오픈루프 스윕 실측 (logs/mecanum_bringup/openloop_sweep.json).
    speed_kp: 10.0
    speed_ki: 8.0
    speed_kd: 0.0
    min_pwm: 10.0
    max_pwm: 250.0
    feedforward_slope: 6.9
    integral_limit: 20.0
    position_kp: 6.0
    position_kd: 0.0
    # 2026-07-17: 가속 12→24 상향 (45도 회전 1.3→0.8s 목표, 소이동 재검증 필요)
    position_max_rad_s: 6.0
    position_accel_rad_s2: 24.0
    # 2026-07-15: 0.035(바퀴 1.2mm)는 바닥 부하 + RR 단채널 정착 노이즈에서
    # 스트레이프/회전 move가 hold를 못 채워 timeout → 0.08(바퀴 ~3mm)로 완화.
    # 2026-07-16: 0.08도 소이동/회전 정지마찰 진동 밖 → 잦은 4.9s 타임아웃
    # (경기장 E2E: 회전 8회 중 3회, 접근 정렬 이동). 0.20(바퀴 ~7.8mm,
    # 회전 ~2.2도)으로 과감히 상향 — 파지 허용 ±55mm 대비 수용 가능.
    # 2026-07-20: 운반 부하(물체 파지 후진/적재 전·후퇴)에서 0.20도 재발 —
    # E2E 3런에서 단발이동 절반이 정착 실패로 데드라인(5s+) 소진, 런당
    # 36~74s 손실. 0.30(바퀴 ~11.7mm) + hold 100→50ms로 완화. 타임아웃
    # 후에도 러너는 진행하고 적재 5/5 성공했으므로 실효 정밀도는 동일,
    # 대기 시간만 회수하는 조치. 벤치 -0.2m 후진 ×20 재검증 예정.
    position_tolerance_rad: 0.30
    position_hold_ms: 50
    # 2026-07-15: 0.8이면 정착 FF(min_pwm+ff*0.8=15pwm)가 FL 역방향 데드밴드에
    # 못 미쳐 CCW 회전 정착이 적분 감길 때까지 수 초 지연/타임아웃 → 1.4로 상향.
    position_min_rad_s: 1.4

gripper_bridge_node:
  ros__parameters:
    # [2026-07-23] 보드 교체로 시리얼 번호가 바뀌었다(구 D8463AD2… → 신 DF14890F…).
    # 고정 시리얼 대신 글롭으로 — 노드가 primary 패턴도 glob 으로 전개하므로
    # (gripper_bridge_node.serial_port_candidates) 보드를 또 바꿔도 그대로 붙는다.
    serial_port: /dev/serial/by-id/usb-ROBOTIS_OpenRB-150*-if00
    serial_port_candidates: /dev/serial/by-id/usb-ROBOTIS_OpenRB-150*-if00,/dev/serial/by-id/usb-Arduino_LLC_OpenRB-if00,/dev/serial/by-path/platform-3610000.usb-usb-0:2.3.3:1.0,/dev/ttyACM1
    control_mode: command
    command_topic: /gripper/command
    status_topic: /gripper/state
    objects_topic: /semantic/objects
    open_on_shutdown: false
    # 2026-07-16 그리퍼 재조립 후 실측: 닫힘 36.74 / 열림 214.37 (펌웨어 상수와 일치)
    open_deg: 214.37
    closed_deg: 36.74
    # 2026-07-17 grasp 성공/실패 판정 (CLOSE 후 정착 위치갭 기반, 전류는 보조).
    # 실측 양쪽 확정(2026-07-17): 빈손 갭 3.0~3.2deg/전류 107~113raw,
    # 정20면체 물림 갭 14.1deg/전류 120raw(포화). → 전류는 빈손·물림 구별
    # 불가(둘 다 포화), 위치갭이 주 신호. gap>=8.0deg 임계가 3.2와 14.1 사이
    # 중앙(양쪽 마진 ~5deg)이라 견고. 얇은 물체 물림 시엔 재확인 권장.
    grasp_check_enabled: true
    # 2026-07-17 정착 곡선 실측: 빈손 ~577ms/물림 ~537ms에 위치 dead-flat.
    # delay 0.6+window 0.2 → 판정 ~0.8s (기존 1.3s 대비 0.5s/파지 단축).
    grasp_check_delay_sec: 0.6
    grasp_check_window_sec: 0.25
    grasp_pos_gap_deg: 8.0
    grasp_current_raw_min: 60
    grasp_topic: /gripper/grasp

